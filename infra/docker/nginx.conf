server {
  listen 8080;
  server_name _;

  client_max_body_size 20g;
  sendfile on;
  tcp_nopush on;

  # The first public-share request carries its bearer token in the path.
  # Do not persist that credential in reverse-proxy access logs.
  location ~ ^/share-api/v1/entries/ {
    access_log off;
    proxy_pass http://core:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 30m;
    proxy_send_timeout 30m;
  }

  location ~ ^/(api|health|share-api|join-api)/ {
    proxy_pass http://core:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 30m;
    proxy_send_timeout 30m;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    add_header X-Content-Type-Options nosniff always;
  }
}
