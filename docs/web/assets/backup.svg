<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">维护操作先保护数据</title><desc id="desc">下载来源、完整性、停服证明和恢复检查缺一不可。。恢复会替换实例数据；先运行只读检查，不能绕过拒绝保护。</desc><rect width="960" height="350" rx="18" fill="#FBFAF7"/><g font-family="-apple-system, PingFang SC, Microsoft YaHei, sans-serif"><text x="40" y="49" fill="#17181B" font-size="23" font-weight="700">维护操作先保护数据</text><text x="40" y="78" fill="#4F5259" font-size="14">下载来源、完整性、停服证明和恢复检查缺一不可。</text><rect x="40.0" y="128" width="156.8" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="62.0" cy="155" r="12" fill="#286BFF"/><text x="62.0" y="160" text-anchor="middle" fill="white" font-size="12">1</text><text x="56.0" y="191" fill="#17181B" font-size="17" font-weight="650">准备备份</text><text x="56.0" y="214" fill="#4F5259" font-size="12">数据归档 + 元数据</text><text x="56.0" y="232" fill="#4F5259" font-size="12">另备份外部媒体</text><path d="M201.8 188h14m-5-5 5 5-5 5" fill="none" stroke="#286BFF" stroke-width="2"/><rect x="220.8" y="128" width="156.8" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="242.8" cy="155" r="12" fill="#286BFF"/><text x="242.8" y="160" text-anchor="middle" fill="white" font-size="12">2</text><text x="236.8" y="191" fill="#17181B" font-size="17" font-weight="650">核对更新输入</text><text x="236.8" y="214" fill="#4F5259" font-size="12">安装包 + SHA-256</text><text x="236.8" y="232" fill="#4F5259" font-size="12">对应版本清单</text><path d="M382.6 188h14m-5-5 5 5-5 5" fill="none" stroke="#286BFF" stroke-width="2"/><rect x="401.6" y="128" width="156.8" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="423.6" cy="155" r="12" fill="#286BFF"/><text x="423.6" y="160" text-anchor="middle" fill="white" font-size="12">3</text><text x="417.6" y="191" fill="#17181B" font-size="17" font-weight="650">执行更新</text><text x="417.6" y="214" fill="#4F5259" font-size="12">校验并停止服务</text><text x="417.6" y="232" fill="#4F5259" font-size="12">切换与健康检查</text><path d="M563.4000000000001 188h14m-5-5 5 5-5 5" fill="none" stroke="#286BFF" stroke-width="2"/><rect x="582.4000000000001" y="128" width="156.8" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="604.4000000000001" cy="155" r="12" fill="#286BFF"/><text x="604.4000000000001" y="160" text-anchor="middle" fill="white" font-size="12">4</text><text x="598.4000000000001" y="191" fill="#17181B" font-size="17" font-weight="650">业务验证</text><text x="598.4000000000001" y="214" fill="#4F5259" font-size="12">项目 / 旧片 / 新上传</text><text x="598.4000000000001" y="232" fill="#4F5259" font-size="12">分享与视频</text><path d="M744.2 188h14m-5-5 5 5-5 5" fill="none" stroke="#286BFF" stroke-width="2"/><rect x="763.2" y="128" width="156.8" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="785.2" cy="155" r="12" fill="#286BFF"/><text x="785.2" y="160" text-anchor="middle" fill="white" font-size="12">5</text><text x="779.2" y="191" fill="#17181B" font-size="17" font-weight="650">失败时处理</text><text x="779.2" y="214" fill="#4F5259" font-size="12">保留备份与日志</text><text x="779.2" y="232" fill="#4F5259" font-size="12">按工具恢复 / 回滚</text><text x="40" y="291" fill="#286BFF" font-size="14">恢复会替换实例数据；先运行只读检查，不能绕过拒绝保护。</text><text x="40" y="322" fill="#4F5259" font-size="11" letter-spacing="1.5">VISTO DOCUMENTATION / 原创流程示意</text></g></svg>