<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">拥有账号，不等于已加入项目</title><desc id="desc">以项目成员关系和具体权限划定业务边界。。Owner 管理全局；普通成员与分享访客不获得任意主机目录权限。</desc><rect width="960" height="350" rx="18" fill="#FBFAF7"/><g font-family="-apple-system, PingFang SC, Microsoft YaHei, sans-serif"><text x="40" y="49" fill="#17181B" font-size="23" font-weight="700">拥有账号，不等于已加入项目</text><text x="40" y="78" fill="#4F5259" font-size="14">以项目成员关系和具体权限划定业务边界。</text><rect x="40.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="62.0" cy="155" r="12" fill="#286BFF"/><text x="62.0" y="160" text-anchor="middle" fill="white" font-size="12">1</text><text x="56.0" y="191" fill="#17181B" font-size="17" font-weight="650">独立账号</text><text x="56.0" y="214" fill="#4F5259" font-size="12">邀请 / 注册</text><text x="56.0" y="232" fill="#4F5259" font-size="12">个人身份</text><path d="M247.0 188h14m-5-5 5 5-5 5" fill="none" stroke="#286BFF" stroke-width="2"/><rect x="266.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="288.0" cy="155" r="12" fill="#286BFF"/><text x="288.0" y="160" text-anchor="middle" fill="white" font-size="12">2</text><text x="282.0" y="191" fill="#17181B" font-size="17" font-weight="650">加入具体项目</text><text x="282.0" y="214" fill="#4F5259" font-size="12">项目主管添加</text><text x="282.0" y="232" fill="#4F5259" font-size="12">角色与期限</text><path d="M473.0 188h14m-5-5 5 5-5 5" fill="none" stroke="#286BFF" stroke-width="2"/><rect x="492.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="514.0" cy="155" r="12" fill="#286BFF"/><text x="514.0" y="160" text-anchor="middle" fill="white" font-size="12">3</text><text x="508.0" y="191" fill="#17181B" font-size="17" font-weight="650">具体操作权限</text><text x="508.0" y="214" fill="#4F5259" font-size="12">上传 / 审阅 / 分享</text><text x="508.0" y="232" fill="#4F5259" font-size="12">按需要授权</text><path d="M699.0 188h14m-5-5 5 5-5 5" fill="none" stroke="#286BFF" stroke-width="2"/><rect x="718.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="740.0" cy="155" r="12" fill="#286BFF"/><text x="740.0" y="160" text-anchor="middle" fill="white" font-size="12">4</text><text x="734.0" y="191" fill="#17181B" font-size="17" font-weight="650">分享访客</text><text x="734.0" y="214" fill="#4F5259" font-size="12">指定审阅入口</text><text x="734.0" y="232" fill="#4F5259" font-size="12">单独访问策略</text><text x="40" y="291" fill="#286BFF" font-size="14">Owner 管理全局；普通成员与分享访客不获得任意主机目录权限。</text><text x="40" y="322" fill="#4F5259" font-size="11" letter-spacing="1.5">VISTO DOCUMENTATION / 原创流程示意</text></g></svg>