<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">把作品与反馈放回同一个上下文</title><desc id="desc">工作空间容纳项目；审阅固定具体版本，而不只引用文件名。。上传 V2 后，为 V2 创建下一轮；V1 的审阅与评论继续保留。</desc><rect width="960" height="350" rx="18" fill="#FBFAF7"/><g font-family="-apple-system, PingFang SC, Microsoft YaHei, sans-serif"><text x="40" y="49" fill="#17181B" font-size="23" font-weight="700">把作品与反馈放回同一个上下文</text><text x="40" y="78" fill="#4F5259" font-size="14">工作空间容纳项目；审阅固定具体版本，而不只引用文件名。</text><rect x="40.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="62.0" cy="155" r="12" fill="#286BFF"/><text x="62.0" y="160" text-anchor="middle" fill="white" font-size="12">1</text><text x="56.0" y="191" fill="#17181B" font-size="17" font-weight="650">项目</text><text x="56.0" y="214" fill="#4F5259" font-size="12">协作范围与成员</text><text x="56.0" y="232" fill="#4F5259" font-size="12">品牌短片</text><path d="M247.0 188h14m-5-5 5 5-5 5" fill="none" stroke="#286BFF" stroke-width="2"/><rect x="266.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="288.0" cy="155" r="12" fill="#286BFF"/><text x="288.0" y="160" text-anchor="middle" fill="white" font-size="12">2</text><text x="282.0" y="191" fill="#17181B" font-size="17" font-weight="650">资产</text><text x="282.0" y="214" fill="#4F5259" font-size="12">一份持续修订的作品</text><text x="282.0" y="232" fill="#4F5259" font-size="12">品牌主片</text><path d="M473.0 188h14m-5-5 5 5-5 5" fill="none" stroke="#286BFF" stroke-width="2"/><rect x="492.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="514.0" cy="155" r="12" fill="#286BFF"/><text x="514.0" y="160" text-anchor="middle" fill="white" font-size="12">3</text><text x="508.0" y="191" fill="#17181B" font-size="17" font-weight="650">版本 V1 / V2</text><text x="508.0" y="214" fill="#4F5259" font-size="12">每次修订的记录</text><text x="508.0" y="232" fill="#4F5259" font-size="12">保留历史</text><path d="M699.0 188h14m-5-5 5 5-5 5" fill="none" stroke="#286BFF" stroke-width="2"/><rect x="718.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="740.0" cy="155" r="12" fill="#286BFF"/><text x="740.0" y="160" text-anchor="middle" fill="white" font-size="12">4</text><text x="734.0" y="191" fill="#17181B" font-size="17" font-weight="650">审阅</text><text x="734.0" y="214" fill="#4F5259" font-size="12">选择版本与参与者</text><text x="734.0" y="232" fill="#4F5259" font-size="12">反馈与结论</text><text x="40" y="291" fill="#286BFF" font-size="14">上传 V2 后，为 V2 创建下一轮；V1 的审阅与评论继续保留。</text><text x="40" y="322" fill="#4F5259" font-size="11" letter-spacing="1.5">VISTO DOCUMENTATION / 原创流程示意</text></g></svg>