<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">Keep work and feedback together</title><desc id="desc">A review records selected versions, not just filenames.。Create a new review for V2; keep the V1 review and its comments.</desc><rect width="960" height="350" rx="18" fill="#FBFAF7"/><g font-family="-apple-system, PingFang SC, Microsoft YaHei, sans-serif"><text x="40" y="49" fill="#17181B" font-size="23" font-weight="700">Keep work and feedback together</text><text x="40" y="78" fill="#4F5259" font-size="14">A review records selected versions, not just filenames.</text><rect x="40.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="62.0" cy="155" r="12" fill="#286BFF"/><text x="62.0" y="160" text-anchor="middle" fill="white" font-size="12">1</text><text x="56.0" y="191" fill="#17181B" font-size="17" font-weight="650">Project</text><text x="56.0" y="214" fill="#4F5259" font-size="12">Members and scope</text><text x="56.0" y="232" fill="#4F5259" font-size="12">Brand film</text><path d="M247.0 188h14m-5-5 5 5-5 5" fill="none" stroke="#286BFF" stroke-width="2"/><rect x="266.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="288.0" cy="155" r="12" fill="#286BFF"/><text x="288.0" y="160" text-anchor="middle" fill="white" font-size="12">2</text><text x="282.0" y="191" fill="#17181B" font-size="17" font-weight="650">Asset</text><text x="282.0" y="214" fill="#4F5259" font-size="12">One piece of work</text><text x="282.0" y="232" fill="#4F5259" font-size="12">Main film</text><path d="M473.0 188h14m-5-5 5 5-5 5" fill="none" stroke="#286BFF" stroke-width="2"/><rect x="492.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="514.0" cy="155" r="12" fill="#286BFF"/><text x="514.0" y="160" text-anchor="middle" fill="white" font-size="12">3</text><text x="508.0" y="191" fill="#1