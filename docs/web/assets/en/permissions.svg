<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">An account is not project access</title><desc id="desc">Project membership and permissions determine access.。The Owner manages the workspace; project roles stay within their scope.</desc><rect width="960" height="350" rx="18" fill="#FBFAF7"/><g font-family="-apple-system, PingFang SC, Microsoft YaHei, sans-serif"><text x="40" y="49" fill="#17181B" font-size="23" font-weight="700">An account is not project access</text><text x="40" y="78" fill="#4F5259" font-size="14">Project membership and permissions determine access.</text><rect x="40.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="62.0" cy="155" r="12" fill="#286BFF"/><text x="62.0" y="160" text-anchor="middle" fill="white" font-size="12">1</text><text x="56.0" y="191" fill="#17181B" font-size="17" font-weight="650">Account</text><text x="56.0" y="214" fill="#4F5259" font-size="12">Individual identity</text><text x="56.0" y="232" fill="#4F5259" font-size="12">Invite / registration</text><path d="M247.0 188h14m-5-5 5 5-5 5" fill="none" stroke="#286BFF" stroke-width="2"/><rect x="266.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="288.0" cy="155" r="12" fill="#286BFF"/><text x="288.0" y="160" text-anchor="middle" fill="white" font-size="12">2</text><text x="282.0" y="191" fill="#17181B" font-size="17" font-weight="650">Project</text><text x="282.0" y="214" fill="#4F5259" font-size="12">Add the member</text><text x="282.0" y="232" fill="#4F5259" font-size="12">Role and expiry</text><path d="M473.0 188h14m-5-5 5 5-5 5" fill="none" stroke="#286BFF" stroke-width="2"/><rect x="492.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="514.0" cy="155" r="12" fill="#286BFF"/><text x="514.0" y="160" text-anchor="middle" fill="white" font-size="12">3</text><text x="508.0" y="191" fill="#17181B" font-size="17" font-weight="650">Permissions</text><text x="508.0" y="214" fill="#4F5259" font-size="12">Upload / review</text><text x="508.0" y="232" fill="#4F5259" font-size="12">Share / decisions</text><path d="M699.0 188h14m-5-5 5 5-5 5" fill="none" stroke="#286BFF" stroke-width="2"/><rect x="718.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="740.0" cy="155" r="12" fill="#286BFF"/><text x="740.0" y="160" text-anchor="middle" fill="white" font-size="12">4</text><text x="734.0" y="191" fill="#17181B" font-size="17" font-weight="650">Share visitor</text><text x="734.0" y="214" fill="#4F5259" font-size="12">One review link</text><text x="734.0" y="232" fill="#4F5259" font-size="12">Access policy</text><text x="40" y="291" fill="#286BFF" font-size="14">The Owner manages the workspace; project roles stay within their scope.</text><text x="40" y="322" fill="#4F5259" font-size="11" letter-spacing="1.5">VISTO DOCUMENTATION / WORKFLOW DIAGRAM</text></g></svg>