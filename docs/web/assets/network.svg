<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">外部协作先有一个可达入口</title><desc id="desc">远程访问依赖你的部署与网络；本机地址只对当前设备有效。。网页 HTTPS 开关限制请求，但不会替你配置证书、代理或公网域名。</desc><rect width="960" height="350" rx="18" fill="#FBFAF7"/><g font-family="-apple-system, PingFang SC, Microsoft YaHei, sans-serif"><text x="40" y="49" fill="#17181B" font-size="23" font-weight="700">外部协作先有一个可达入口</text><text x="40" y="78" fill="#4F5259" font-size="14">远程访问依赖你的部署与网络；本机地址只对当前设备有效。</text><rect x="40.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="62.0" cy="155" r="12" fill="#286BFF"/><text x="62.0" y="160" text-anchor="middle" fill="white" font-size="12">1</text><text x="56.0" y="191" fill="#17181B" font-size="17" font-weight="650">团队 / 客户</text><text x="56.0" y="214" fill="#4F5259" font-size="12">浏览器</text><text x="56.0" y="232" fill="#4F5259" font-size="12">HTTPS 团队地址</text><path d="M247.0 188h14m-5-5 5 5-5 5" fill="none" stroke="#286BFF" stroke-width="2"/><rect x="266.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="288.0" cy="155" r="12" fill="#286BFF"/><text x="288.0" y="160" text-anchor="middle" fill="white" font-size="12">2</text><text x="282.0" y="191" fill="#17181B" font-size="17" font-weight="650">HTTPS 网关</text><text x="282.0" y="214" fill="#4F5259" font-size="12">域名与证书</text><text x="282.0" y="232" fill="#4F5259" font-size="12">唯一公开入口</text><path d="M473.0 188h14m-5-5 5 5-5 5" fill="none" stroke="#286BFF" stroke-width="2"/><rect x="492.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="514.0" cy="155" r="12" fill="#286BFF"/><text x="514.0" y="160" text-anchor="middle" fill="white" font-size="12">3</text><text x="508.0" y="191" fill="#17181B" font-size="17" font-weight="650">Visto Server</text><text x="508.0" y="214" fill="#4F5259" font-size="12">会话 / 项目权限</text><text x="508.0" y="232" fill="#4F5259" font-size="12">分享访问策略</text><path d="M699.0 188h14m-5-5 5 5-5 5" fill="none" stroke="#286BFF" stroke-width="2"/><rect x="718.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="740.0" cy="155" r="12" fill="#286BFF"/><text x="740.0" y="160" text-anchor="middle" fill="white" font-size="12">4</text><text x="734.0" y="191" fill="#17181B" font-size="17" font-weight="650">授权存储</text><text x="734.0" y="214" fill="#4F5259" font-size="12">本机 / WebDAV / S3</text><text x="734.0" y="232" fill="#4F5259" font-size="12">按配置保存</text><text x="40" y="291" fill="#286BFF" font-size="14">网页 HTTPS 开关限制请求，但不会替你配置证书、代理或公网域名。</text><text x="40" y="322" fill="#4F5259" font-size="11" letter-spacing="1.5">VISTO DOCUMENTATION / 原创流程示意</text></g></svg>