<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">Apple Silicon macOS 安装路线</title><desc id="desc">在部署主机上操作；只放行已核对来源与摘要的程序。。这是流程示意；系统提示以实际 macOS 版本为准。</desc><rect width="960" height="350" rx="18" fill="#FBFAF7"/><g font-family="-apple-system, PingFang SC, Microsoft YaHei, sans-serif"><text x="40" y="49" fill="#17181B" font-size="23" font-weight="700">Apple Silicon macOS 安装路线</text><text x="40" y="78" fill="#4F5259" font-size="14">在部署主机上操作；只放行已核对来源与摘要的程序。</text><rect x="40.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="62.0" cy="155" r="12" fill="#286BFF"/><text x="62.0" y="160" text-anchor="middle" fill="white" font-size="12">1</text><text x="56.0" y="191" fill="#17181B" font-size="17" font-weight="650">核对安装包</text><text x="56.0" y="214" fill="#4F5259" font-size="12">架构与版本一致</text><text x="56.0" y="232" fill="#4F5259" font-size="12">比较 SHA-256</text><path d="M247.0 188h14m-5-5 5 5-5 5" fill="none" stroke="#286BFF" stroke-width="2"/><rect x="266.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="288.0" cy="155" r="12" fill="#286BFF"/><text x="288.0" y="160" text-anchor="middle" fill="white" font-size="12">2</text><text x="282.0" y="191" fill="#17181B" font-size="17" font-weight="650">运行安装器</text><text x="282.0" y="214" fill="#4F5259" font-size="12">解压新目录</text><text x="282.0" y="232" fill="#4F5259" font-size="12">需要管理员权限</text><path d="M473.0 188h14m-5-5 5 5-5 5" fill="none" stroke="#286BFF" stroke-width="2"/><rect x="492.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="514.0" cy="155" r="12" fill="#286BFF"/><text x="514.0" y="160" text-anchor="middle" fill="white" font-size="12">3</text><text x="508.0" y="191" fill="#17181B" font-size="17" font-weight="650">按需独立放行</text><text x="508.0" y="214" fill="#4F5259" font-size="12">visto-core</text><text x="508.0" y="232" fill="#4F5259" font-size="12">visto-server</text><path d="M699.0 188h14m-5-5 5 5-5 5" fill="none" stroke="#286BFF" stroke-width="2"/><rect x="718.0" y="128" width="202.0" height="118" rx="12" fill="white" stroke="#EAE7DE"/><circle cx="740.0" cy="155" r="12" fill="#286BFF"/><text x="740.0" y="160" text-anchor="middle" fill="white" font-size="12">4</text><text x="734.0" y="191" fill="#17181B" font-size="17" font-weight="650">验证与初始化</text><text x="734.0" y="214" fill="#4F5259" font-size="12">health/ready</text><text x="734.0" y="232" fill="#4F5259" font-size="12">创建 Owner</text><text x="40" y="291" fill="#286BFF" font-size="14">这是流程示意；系统提示以实际 macOS 版本为准。</text><text x="40" y="322" fill="#4F5259" font-size="11" letter-spacing="1.5">VISTO DOCUMENTATION / 原创流程示意</text></g></svg>